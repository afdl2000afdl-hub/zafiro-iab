name: IAB Debug APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 (Chaquopy requirement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Accept Android SDK licenses
        run: |
          set +e
          mkdir -p /usr/lib/android-sdk/licenses /usr/local/lib/android/sdk/licenses ~/.android
          for L in /usr/lib/android-sdk/licenses /usr/local/lib/android/sdk/licenses ~/.android; do
            printf '24333f8a63b6825ea6c576efb6756f278c7d46af\n8933bad161af4178b118f24a07e205cbe1c61345\nd56f5187479441e58a5782f4f6c3f24d' > "$L/android-sdk-license" 2>/dev/null
            printf '84831e90f9f4d50b8b954f371a5b57f391ab3774' > "$L/android-sdk-preview-license" 2>/dev/null
          done
          exit 0

      - name: Extract source tarball
        run: |
          set -e
          mkdir -p /tmp/zafiro-src
          tar -xzf zafiro-iab-src.tar.gz -C /tmp/zafiro-src
          ls /tmp/zafiro-src
          test -f /tmp/zafiro-src/settings.gradle.kts && echo "settings.gradle.kts OK" || { echo "MISSING settings.gradle.kts"; ls -R /tmp/zafiro-src | head -40; exit 1; }

      - name: Point local.properties at writable SDK dir
        run: |
          set -e
          export SDKDIR=/home/runner/android-sdk
          mkdir -p "$SDKDIR/licenses"
          printf '24333f8a63b6825ea6c576efb6756f278c7d46af\n8933bad161af4178b118f24a07e205cbe1c61345\nd56f5187479441e58a5782f4f6c3f24d' > "$SDKDIR/licenses/android-sdk-license"
          echo "sdk.dir=$SDKDIR" > /tmp/zafiro-src/local.properties
          cat /tmp/zafiro-src/local.properties
          if [ -d /usr/lib/android-sdk/platforms ] && [ -d /usr/lib/android-sdk/build-tools ]; then
            echo "system SDK present, using /usr/lib/android-sdk"
            echo "sdk.dir=/usr/lib/android-sdk" > /tmp/zafiro-src/local.properties
            cat /tmp/zafiro-src/local.properties
          fi

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build debug APK
        run: |
          cd /tmp/zafiro-src
          sh gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log
          echo "BUILD_RC=${PIPESTATUS[0]}"

      - name: Locate and stage APK
        run: |
          set -e
          cd /tmp/zafiro-src
          echo "=== apk output dir ==="
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || echo "debug apk dir missing"
          ls -lh app/build/outputs/apk/ 2>/dev/null || true
          find app/build/outputs -name "*.apk" 2>/dev/null || echo "no apk found under app/build/outputs"
          test -f app/build/outputs/apk/debug/app-debug.apk && echo "APK_OK" || echo "APK_MISSING"
          mkdir -p "$GITHUB_WORKSPACE/out"
          if test -f app/build/outputs/apk/debug/app-debug.apk; then
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/app-debug.apk"
            echo "APK staged to GITHUB_WORKSPACE/out"
          fi

      - name: Upload debug APK as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-IAB-debug.apk
          path: out/app-debug.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/zafiro-src/build-output.log
          retention-days: 3
          if-no-files-found: warn
