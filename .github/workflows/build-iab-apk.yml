name: IAB Debug APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 (Chaquopy requirement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract source tarball
        run: |
          set -e
          mkdir -p /tmp/zafiro-src
          tar -xzf zafiro-iab-src.tar.gz -C /tmp/zafiro-src
          test -f /tmp/zafiro-src/settings.gradle.kts && echo "settings.gradle.kts OK" || { echo "MISSING"; ls -R /tmp/zafiro-src | head -40; exit 1; }

      - name: Set up Android SDK + licenses
        run: |
          set -e
          export SDKDIR=/home/runner/android-sdk
          mkdir -p "$SDKDIR/licenses"
          printf '24333f8a63b6825ea6c576efb6756f278c7d46af\n8933bad161af4178b118f24a07e205cbe1c61345\nd56f5187479441e58a5782f4f6c3f24d' > "$SDKDIR/licenses/android-sdk-license"
          printf '8933bad161af4178b118f24a07e205cbe1c61345' > "$SDKDIR/licenses/android-sdk-preview-license"
          echo "sdk.dir=$SDKDIR" > /tmp/zafiro-src/local.properties
          cat /tmp/zafiro-src/local.properties
          echo "licenses written to $SDKDIR/licenses"
          ls -la "$SDKDIR/licenses"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build debug APK
        run: |
          set -o pipefail
          cd /tmp/zafiro-src
          sh gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Locate APK
        run: |
          set -e
          cd /tmp/zafiro-src
          echo "=== apk find ==="
          find app/build -name "*.apk" 2>/dev/null || echo "NO APK under app/build"
          APK="$(find app/build -name '*.apk' 2>/dev/null | head -1)"
          if [ -n "$APK" ]; then
            echo "APK found: $APK"
            mkdir -p "$GITHUB_WORKSPACE/out"
            cp "$APK" "$GITHUB_WORKSPACE/out/zafiro-debug.apk"
            echo "APK staged"
          else
            echo "APK_NOT_FOUND"
            tail -80 build-output.log
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-IAB-debug
          path: out/
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/zafiro-src/build-output.log
          retention-days: 3
          if-no-files-found: warn
