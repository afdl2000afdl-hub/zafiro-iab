name: IAB Debug APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 (Chaquopy requirement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Accept Android SDK licenses
        run: |
          set +e
          mkdir -p /usr/lib/android-sdk/licenses /usr/local/lib/android/sdk/licenses ~/.android
          for L in /usr/lib/android-sdk/licenses /usr/local/lib/android/sdk/licenses ~/.android; do
            printf '24333f8a63b6825ea6c576efb6756f278c7d46af\n8933bad161af4178b118f24a07e205cbe1c61345\nd56f5187479441e58a5782f4f6c3f24d' > "$L/android-sdk-license" 2>/dev/null
            printf '84831e90f9f4d50b8b954f371a5b57f391ab3774' > "$L/android-sdk-preview-license" 2>/dev/null
          done
          exit 0

      - name: Extract source tarball
        run: |
          set -e
          mkdir -p /tmp/zafiro-src
          tar -xzf zafiro-iab-src.tar.gz -C /tmp/zafiro-src
          test -f /tmp/zafiro-src/settings.gradle.kts && echo "settings.gradle.kts OK" || { echo "MISSING"; ls -R /tmp/zafiro-src | head -40; exit 1; }

      - name: Point local.properties at writable SDK dir
        run: |
          set -e
          export SDKDIR=/home/runner/android-sdk
          mkdir -p "$SDKDIR/licenses"
          printf '24333f8a63b6825ea6c576efb6756f278c7d46af\n8933bad161af4178b118f24a07e205cbe1c61345\nd56f5187479441e58a5782f4f6c3f24d' > "$SDKDIR/licenses/android-sdk-license"
          echo "sdk.dir=$SDKDIR" > /tmp/zafiro-src/local.properties
          if [ -d /usr/lib/android-sdk/platforms ] && [ -d /usr/lib/android-sdk/build-tools ]; then
            echo "system SDK present, using /usr/lib/android-sdk"
            echo "sdk.dir=/usr/lib/android-sdk" > /tmp/zafiro-src/local.properties
          fi
          cat /tmp/zafiro-src/local.properties

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build debug APK
        run: |
          set -o pipefail
          cd /tmp/zafiro-src
          sh gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Publish report to repo
        if: always()
        run: |
          set +e
          cd /tmp/zafiro-src
          REPORT="$GITHUB_WORKSPACE/build-report.txt"
          {
            echo "=== apk find ==="
            find app/build -name "*.apk" 2>/dev/null || echo "NO APK under app/build"
            echo "=== outputs dir ==="
            ls -lR app/build/outputs 2>/dev/null | head -80 || echo "no outputs dir"
            echo "=== gradle tail (last 120 lines) ==="
            tail -120 build-output.log 2>/dev/null || echo "no log"
          } > "$REPORT"
          echo "=== report preview ==="
          head -30 "$REPORT"

          TOKEN="$GITHUB_TOKEN"
          REPO="afdl2000afdl-hub/zafiro-iab"
          B64="$(base64 -w0 "$REPORT")"
          SHA="$(curl -s -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/contents/build-report.txt" \
                | grep -o '"sha":"[^"]*"' | head -1 | cut -d'"' -f4)"
          if [ -n "$SHA" ]; then
            printf '{"message":"ci: build report","content":"%s","encoding":"base64","sha":"%s"}' "$B64" "$SHA" > /tmp/report.json
          else
            printf '{"message":"ci: build report","content":"%s","encoding":"base64"}' "$B64" > /tmp/report.json
          fi
          curl -s -X PUT -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
               --data-binary @/tmp/report.json \
               "https://api.github.com/repos/$REPO/contents/build-report.txt" \
               -o /tmp/put.json -w "put_report_http=%{http_code}\n"
          echo "--- put response ---"
          head -c 300 /tmp/put.json; echo

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/zafiro-src/build-output.log
          retention-days: 7
          if-no-files-found: warn
