name: IAB Debug APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/lib/android-sdk
  ANDROID_HOME: /usr/lib/android-sdk
  ANDROID_SDK_HOME: /usr/lib/android-sdk

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 (Chaquopy requirement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure sdkmanager exists (try install first)
        run: |
          set +e
          # 1) If sdkmanager already exists, we are done
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager already present"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
            exit 0
          fi
          # 2) Try to install via apt (some images keep android cmdline tools in apt)
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq android-sdk cmdline-tools 2>/dev/null || true
          # Some distros put it in /usr/lib/android-sdk or /usr/local/lib/android/sdk
          for p in /usr/lib/android-sdk /usr/local/lib/android/sdk; do
            if [ -d "$p/cmdline-tools" ]; then
              echo "found cmdline-tools at $p - copying into $ANDROID_HOME"
              mkdir -p "$ANDROID_HOME"
              cp -r "$p/cmdline-tools" "$ANDROID_HOME/" 2>/dev/null || true
              break
            fi
          done
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager ready via apt/copy"
            exit 0
          fi
          echo "apt route failed, will try downloads next"
          exit 0

      - name: Download cmdline-tools if still missing
        run: |
          set +e
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager already available, skipping download"
            exit 0
          fi
          # Try known commandlinetools versions (newest first)
          for VER in 13114758 11076708 10406320 9477386 8512563 7583922 7069904; do
            echo "trying commandlinetools-linux-${VER}_latest.zip"
            if curl -fsSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-${VER}_latest.zip"; then
              echo "downloaded ok"
              break
            else
              echo "404 for $VER, trying next"
            fi
          done
          if [ ! -s /tmp/cmdtools.zip ]; then
            echo "FAILED: could not download cmdline-tools from any known version"
            exit 1
          fi
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/cmdtools.zip -d /tmp/
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          chmod +x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "=== verifying sdkmanager ==="
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          echo "SDKMANAGER_OK"

      - name: Accept licenses + install SDK components
        run: |
          set -e
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /tmp/lic.log 2>&1 || true
          echo "=== license tail ==="
          tail -5 /tmp/lic.log
          echo "=== installing platforms + build-tools ==="
          "$SDKMGR" "platforms;android-37" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools"
          echo "=== installed ==="
          "$SDKMGR" --list_installed | grep -E "platforms;android-37|build-tools;3[56]"

      - name: Extract source tarball
        run: |
          set -e
          echo "Extracting source..."
          mkdir -p /tmp/zafiro-src
          tar -xzf zafiro-iab-src.tar.gz -C /tmp/zafiro-src
          ls /tmp/zafiro-src
          test -f /tmp/zafiro-src/settings.gradle.kts && echo "settings.gradle.kts OK" || { echo "MISSING settings.gradle.kts"; ls -R /tmp/zafiro-src | head -40; exit 1; }

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build debug APK
        run: |
          cd /tmp/zafiro-src
          sh gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Verify APK exists
        run: |
          cd /tmp/zafiro-src
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk && echo "APK OK"

      - name: Copy APK for artifact
        run: |
          cd /tmp/zafiro-src
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/app-debug.apk"

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-IAB-debug.apk
          path: out/app-debug.apk
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/zafiro-src/build-output.log
          retention-days: 3
          if-no-files-found: ignore
