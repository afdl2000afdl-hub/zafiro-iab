name: IAB Debug APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 (Chaquopy requirement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract source tarball
        run: |
          set -e
          mkdir -p /tmp/zafiro-src
          tar -xzf zafiro-iab-src.tar.gz -C /tmp/zafiro-src
          test -f /tmp/zafiro-src/settings.gradle.kts && echo "settings.gradle.kts OK" || { echo "MISSING"; ls -R /tmp/zafiro-src | head -40; exit 1; }

      - name: Set up Android SDK (cmdline-tools + licenses + packages)
        run: |
          set -e
          export SDKDIR=/home/runner/android-sdk
          mkdir -p "$SDKDIR/cmdline-tools"
          # 1) Obtain sdkmanager: try existing system path first, else download
          SDKMGR=""
          if [ -x /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager ]; then
            SDKMGR=/usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager
            echo "using system sdkmanager"
          else
            echo "downloading cmdline-tools"
            for VER in 13114758 12700977 11076708 10406320 9477386; do
              if curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-${VER}_latest.zip" -o /tmp/cmdtools.zip; then
                echo "downloaded version $VER"
                break
              fi
            done
            test -s /tmp/cmdtools.zip || { echo "cmdline-tools download FAILED for all versions"; exit 1; }
            cd /tmp && unzip -q cmdtools.zip
            rm -rf "$SDKDIR/cmdline-tools/latest"
            mv /tmp/cmdline-tools "$SDKDIR/cmdline-tools/latest"
            chmod +x "$SDKDIR/cmdline-tools/latest/bin/sdkmanager"
            SDKMGR="$SDKDIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKMGR"
          # 2) Accept ALL licenses properly (generates correct hashes into $SDKDIR/licenses)
          yes | "$SDKMGR" --sdk_root="$SDKDIR" --licenses || true
          # 3) Install the exact packages AGP 9.1.1 needs
          "$SDKMGR" --sdk_root="$SDKDIR" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          "$SDKMGR" --sdk_root="$SDKDIR" --list_installed
          # 4) Point the build at this SDK
          echo "sdk.dir=$SDKDIR" > /tmp/zafiro-src/local.properties
          cat /tmp/zafiro-src/local.properties

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build debug APK
        run: |
          set -o pipefail
          cd /tmp/zafiro-src
          sh gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Locate APK
        run: |
          set -e
          cd /tmp/zafiro-src
          echo "=== apk find ==="
          find app/build -name "*.apk" 2>/dev/null || echo "NO APK under app/build"
          APK="$(find app/build -name '*.apk' 2>/dev/null | head -1)"
          if [ -n "$APK" ]; then
            echo "APK found: $APK"
            mkdir -p "$GITHUB_WORKSPACE/out"
            cp "$APK" "$GITHUB_WORKSPACE/out/zafiro-debug.apk"
            echo "APK staged"
          else
            echo "APK_NOT_FOUND"
            tail -80 build-output.log
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-IAB-debug
          path: out/
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/zafiro-src/build-output.log
          retention-days: 3
          if-no-files-found: warn
