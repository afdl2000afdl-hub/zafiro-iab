name: IAB Debug APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/lib/android-sdk
  ANDROID_HOME: /usr/lib/android-sdk

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 (Chaquopy requirement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/ 2>/dev/null || echo "SDK dir not found"
          which sdkmanager 2>/dev/null || echo "sdkmanager not in PATH"
          find $ANDROID_HOME -name "sdkmanager" 2>/dev/null | head -5

      - name: Install Android cmdline-tools if missing
        run: |
          set -e
          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing cmdline-tools..."
            # Download command line tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          chmod +x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "sdkmanager ready: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept licenses + install SDK components
        run: |
          set -e
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses 2>&1 | tail -5
          "$SDKMGR" "platforms;android-37" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools"
          "$SDKMGR" --list_installed

      - name: Extract source tarball
        run: |
          set -e
          echo "Extracting source..."
          mkdir -p /tmp/zafiro-src
          tar -xzf zafiro-iab-src.tar.gz -C /tmp/zafiro-src
          ls /tmp/zafiro-src
          test -f /tmp/zafiro-src/settings.gradle.kts && echo "settings.gradle.kts OK" || { echo "MISSING settings.gradle.kts"; ls -R /tmp/zafiro-src | head -40; exit 1; }

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build debug APK
        run: |
          cd /tmp/zafiro-src
          sh gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/zafiro-src/build-output.log
          retention-days: 7

      - name: Verify APK exists
        run: |
          cd /tmp/zafiro-src
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk && echo "APK OK"

      - name: Copy APK for artifact
        run: |
          cd /tmp/zafiro-src
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/app-debug.apk"

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-IAB-debug.apk
          path: out/app-debug.apk
          retention-days: 7
