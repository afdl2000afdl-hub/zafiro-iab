name: IAB Debug APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/lib/android-sdk

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 (Chaquopy requirement)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure Android cmdline-tools + licenses
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          # If cmdline-tools missing, the ubuntu-latest image provides sdkmanager under $ANDROID_HOME/cmdline-tools
          if [ ! -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sfn latest "$ANDROID_HOME/cmdline-tools/bin" 2>/dev/null || true
          fi
          SDKMGR="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses || true
          "$SDKMGR" --list_installed | head -40 || true

      - name: Install required SDK components
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMGR" --list | grep -E "platforms;android-3[5-9]|build-tools;3[5-9]" || true
          "$SDKMGR" "platforms;android-37" "build-tools;36.0.0" "platform-tools"
          "$SDKMGR" --list_installed

      - name: Extract source tarball
        run: |
          set -e
          echo "Extracting source..."
          mkdir -p /tmp/zafiro-src
          tar -xzf zafiro-iab-src.tar.gz -C /tmp/zafiro-src
          ls /tmp/zafiro-src
          test -f /tmp/zafiro-src/settings.gradle.kts && echo "settings.gradle.kts OK" || { echo "MISSING settings.gradle.kts"; ls -R /tmp/zafiro-src | head -40; exit 1; }

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build debug APK
        run: |
          cd /tmp/zafiro-src
          sh gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/zafiro-src/build-output.log
          retention-days: 7

      - name: Verify APK exists
        run: |
          cd /tmp/zafiro-src
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk && echo "APK OK"

      - name: Copy APK for artifact
        run: |
          cd /tmp/zafiro-src
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/app-debug.apk"

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-IAB-debug.apk
          path: out/app-debug.apk
          retention-days: 7
